<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GameStore</title>
</head>
<body>

    <h1>GameStore</h1>
    <h2>Популярные игры</h2>

    {% for game in games %}
        <div>
            <h3>{{ game.name }}</h3>
            <p>{{ game.description }}</p>
            <p>Цена: {{ game.price }} сум</p>
        </div>
    {% empty %}
        <p>Пока игр нет.</p>
    {% endfor %}

</body>
</html>
