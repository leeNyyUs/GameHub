<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GameStore</title>
</head>
<body>

    <h1>GameStore</h1>
    <h2>Популярные игры</h2>

    {% for game in games %}
    <div id="game-card">
        {% if game.cover %}
            <img src="{{ game.cover.url }}" width="150">
        {% endif %}
        <h2>{{ game.name }}</h2>
        <p>{{ game.description }}</p>
        <p>{{ game.genre }}</p>
        <p>{{ game.price }} сум</p>
    </div>
{% empty %}
    <p>Игр пока нет.</p>
{% endfor %}


</body>
</html>
